version: 2

models:
  - name: dim_tenants
    description: "Dimension des banques partenaires B2B2C"
    config:
      access: public
    columns:
      - name: tenant_id
        tests: [unique, not_null]
      - name: tenant_code
        tests: [unique, not_null]
      - name: contract_tier
        tests:
          - accepted_values:
              arguments:
                values: ['gold', 'silver', 'bronze']

  - name: dim_comptes
    description: "Dimension comptes — état courant. Colonnes PII protégées par masking policy (post_hook)."
    config:
      access: public
    columns:
      - name: compte_id
        tests: [unique, not_null]
      - name: tenant_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tenants')
                field: tenant_id
      - name: nom_client
        config:
          meta: {pii: true, pii_type: name, masking_policy: mask_name}
      - name: prenom_client
        config:
          meta: {pii: true, pii_type: name, masking_policy: mask_name}
      - name: email
        config:
          meta: {pii: true, pii_type: email, masking_policy: mask_email}
      - name: telephone
        config:
          meta: {pii: true, pii_type: phone, masking_policy: mask_phone}
      - name: date_naissance
        config:
          meta: {pii: true, pii_type: date_of_birth, masking_policy: mask_date_of_birth}
      - name: iban
        config:
          meta: {pii: true, pii_type: iban, masking_policy: mask_iban}
      - name: adresse_ligne1
        config:
          meta: {pii: true, pii_type: address, masking_policy: mask_address}
      - name: adresse_ligne2
        config:
          meta: {pii: true, pii_type: address, masking_policy: mask_address}
      - name: statut
        tests:
          - accepted_values:
              arguments:
                values: ['actif', 'inactif', 'cloture', 'suspendu']
      - name: kyc_level
        tests:
          - accepted_values:
              arguments:
                values: ['basic', 'intermediate', 'advanced', 'not_verified']

  - name: dim_categories
    description: "Dimension catégories avec hiérarchie résolue"
    config:
      access: public
    columns:
      - name: categorie_id
        tests: [unique, not_null]

  - name: fct_transactions
    description: |
      Table de faits principale — 50-100M lignes.
      Enrichie avec FX à date, catégorisation, compliance.
    config:
      access: public
    columns:
      - name: transaction_id
        description: "Identifiant unique de la transaction"
        tests: [unique, not_null]
      - name: tenant_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tenants')
                field: tenant_id
      - name: compte_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_comptes')
                field: compte_id
      - name: montant_eur
        tests:
          - not_null
          - dbt_utils.accepted_range:
              config:
                severity: warn
              arguments:
                min_value: 0
                max_value: 100000000
      - name: statut
        tests:
          - accepted_values:
              arguments:
                values: ['validee', 'en_attente']
      - name: date_transaction
        tests: [not_null]

groups:
  - name: core
    owner:
      name: Data Platform Team
      email: data-platform@fintrack.example
